# Azure (y otros servicios) terminan el https por fuera y le pasan http a la app.
# Esta línea le avisa a Laravel que el visitante SÍ entró por https (links, cookies y mapa/ubicación correctos).
SetEnvIf X-Forwarded-Proto "https" HTTPS=on

<Directory /var/www/html/public>
    AllowOverride All
    Require all granted
</Directory>

ServerTokens Prod
ServerSignature Off
